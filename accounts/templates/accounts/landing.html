<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance</title>
    {% load static %}
    <link rel="icon" href="{% static 'icon/favicon.ico' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/destyle.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/default.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/landing.css' %}">
</head>
<body>
    <main class="vanta-bg">
        <h1 class="title">Attendance</h1>
        <div><a href="{% url 'login' %}">ログイン</a></div>
        <div><a href="{% url 'signup' %}">新規登録</a></div>
    </main>
    <!-- 背景 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.halo.min.js"></script>
    <script>
        VANTA.HALO({
            el: ".vanta-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00
        });
    </script>
</body>
</html>
